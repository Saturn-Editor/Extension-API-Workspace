<div class="bar">
  <div class="row">
    <span class="title grow">Secrets</span>
    <span class="chip" id="state"></span>
  </div>
</div>
<div class="pane grow" id="pane"></div>
<script>
  let data = DATA;
  const shown = new Set();
  const $ = id => document.getElementById(id);
  const editor = createEditor(data.values || {}, render);

  function render() {
    const pane = $('pane');
    pane.replaceChildren();
    $('state').textContent = data.state === 'unlocked' ? 'Unlocked' : data.state === 'locked' ? 'Locked' : data.state === 'invalid' ? 'Unreadable' : 'Not encrypted';

    if (data.state === 'invalid') {
      showInvalid(data.invalid);
      return;
    }
    hideInvalid();

    if (data.state === 'none') {
      pane.append(el('div', { className: 'empty' },
        el('p', {}, 'Secrets are stored encrypted, so this workspace needs a password first.'),
        el('p', { className: 'muted' }, 'Choose Encrypt Project… in action search, then come back here.')));
      return;
    }
    if (data.state === 'locked') {
      pane.append(el('div', { className: 'empty' },
        el('p', {}, 'This workspace is locked.'),
        el('p', { className: 'muted' }, 'Unlock it to see and change secret values.')));
      return;
    }

    if (!data.environments.length) {
      pane.append(el('div', { className: 'empty' }, 'There are no environments yet. Add one, then list its secret names there.'));
      return;
    }

    pane.append(el('p', { className: 'muted' },
      'Each value is encrypted with the workspace password, so this file is safe to commit. Add secret names in an environment file.'));

    const values = editor.doc;
    const broken = data.broken || [];
    const isBroken = (id, name) => broken.some(b => b.id === id && b.name === name) && (values[id] || {})[name] === undefined;
    if (broken.length) {
      pane.append(el('div', { className: 'note warning' },
        `${broken.length === 1 ? '1 value' : `${broken.length} values`} can't be decrypted with this workspace's key. They are kept as they are. Type a new value to replace one, or remove it.`));
    }
    for (const env of data.environments) {
      const stored = values[env.id] || {};
      const brokenHere = broken.filter(b => b.id === env.id).map(b => b.name);
      const names = [...new Set([...env.secrets, ...Object.keys(stored), ...brokenHere])];
      pane.append(el('div', { className: 'section' }, env.name, env.missing ? el('span', { className: 'chip', style: 'margin-left: 8px' }, 'environment not found') : null));
      if (!names.length) {
        pane.append(el('p', { className: 'muted' }, 'No secrets listed in this environment.'));
        continue;
      }
      const body = el('tbody');
      for (const name of names) {
        const key = `${env.id}/${name}`;
        const unused = !env.secrets.includes(name);
        const bad = isBroken(env.id, name);
        body.append(el('tr', {},
          el('td', { style: 'width: 30%' }, el('span', { className: 'mono' }, name), unused ? el('span', { className: 'muted' }, ' (not used)') : null),
          el('td', {}, el('input', {
            type: shown.has(key) ? 'text' : 'password',
            value: stored[name] || '',
            placeholder: bad ? "Can't decrypt; type to replace" : 'Not set',
            spellcheck: 'false',
            autocomplete: 'off',
            oninput: e => editor.edit(doc => {
              doc[env.id] = doc[env.id] || {};
              doc[env.id][name] = e.target.value;
            }),
          })),
          el('td', { style: 'width: 60px' }, el('button', {
            className: 'ghost',
            onclick: () => { shown.has(key) ? shown.delete(key) : shown.add(key); render(); },
          }, shown.has(key) ? 'Hide' : 'Show')),
          el('td', { className: 'del' }, unused || stored[name] || bad
            ? el('button', {
                className: 'ghost',
                title: unused || bad ? 'Delete this value' : 'Clear this value',
                onclick: () => {
                  if (bad) {
                    saturn.postMessage({ type: 'dropBroken', id: env.id, name });
                    return;
                  }
                  editor.edit(doc => {
                    if (doc[env.id]) delete doc[env.id][name];
                  }, true);
                  render();
                },
              }, '×')
            : null)));
      }
      pane.append(el('table', { className: 'grid' }, body));
    }
  }

  saturn.onMessage(message => {
    if (message.type === 'undo') editor.undo();
    else if (message.type === 'redo') editor.redo();
    else if (message.type === 'reload') saturn.postMessage({ type: 'reload', text: message.text });
    else if (message.type === 'data') {
      data = message.data;
      editor.replace(data.values || {});
    }
  });

  render();
</script>
